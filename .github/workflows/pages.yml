name: Website

# Checks only: this workflow builds the site from a clean checkout and checks it on
# every push and pull request, and deploys nothing. The site is deployed as a direct
# upload of a reviewed local build to Cloudflare Pages (site-build decision S-4; the
# maintainer runs site/scripts/deploy.ps1), so the bytes that ship are the bytes that
# were reviewed. The build here is the pre-upload one (KILN_SITE_PACKS=0: no Commons
# downloads, no asset mirror), which must stay green on its own.
#
# The gallery is built, not published from a folder of exported meshes: every GLB
# it serves comes out of running `examples/*.kiln.js` through the engine on the
# runner. That is the point of it -- a program and the model the page shows cannot
# drift apart -- and it also means a program that stops building fails here.
on:
  push:
    branches: [main]
    paths:
      - 'examples/**'
      - 'site/**'
      - 'docs/**'
      - 'skills/**'
      - 'bun.lock'
      - 'package.json'
      - 'src/**'
      - 'scripts/authorship.ts'
      - 'README.md'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
  pull_request:
    paths:
      - 'examples/**'
      - 'site/**'
      - 'docs/**'
      - 'skills/**'
      - 'bun.lock'
      - 'package.json'
      - 'src/**'
      - 'scripts/authorship.ts'
      - 'README.md'
      - '.github/workflows/pages.yml'

# A newer push to a branch or pull request supersedes a running check; runs on main
# always finish.
concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  KILN_RENDER: cpu
  # The pre-upload build: no Commons pack pages or downloads, so no asset mirror is
  # needed. The launch-mode build (1) is made and reviewed on the owner's PC.
  KILN_SITE_PACKS: ${{ vars.KILN_SITE_PACKS || '0' }}

jobs:
  build:
    name: build the website
    # Was pinned to windows-2022 because poster receipts asserted exact GLB bytes
    # captured there, and platform float math genuinely does change them --
    # measured, and in both the JSON and BIN chunks, so no canonical form fixes
    # it (ledger 6.1). What changed is that a receipt no longer claims it: it
    # asserts the source and the image, which are platform-stable, and records
    # the artifact hash as provenance rather than as an assertion (6.2).
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.23.2

      - name: Pin maintainer npm
        run: npm install --global npm@12.0.2

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2

      - name: Install the engine
        run: bun install --frozen-lockfile

      # Before the build, deliberately: the gallery images live in R2 now, and
      # whether they are still served and still byte-identical to their receipts
      # has nothing to do with whether the GLBs rebuild. Running it first means a
      # broken bucket reports as a broken bucket rather than hiding behind a
      # build failure.
      - name: Verify the published gallery images
        run: bun scripts/verify-posters.mjs

      - name: Install the site
        run: bun install --frozen-lockfile
        working-directory: site

      - name: Sync repository documentation
        run: bunx astro sync
        working-directory: site

      - name: Typecheck the site
        run: bunx tsc --noEmit
        working-directory: site

      - name: Check Astro templates
        run: bunx astro check
        working-directory: site

      - name: Lint site source
        run: bunx biome check site/src

      # The site's own tests run here, after the site install. The root `bun test`
      # passes `--path-ignore-patterns='{site,scenes}/**'`: bun treats `src` and `scripts` as
      # substring filters on paths, so without it the root run also picked up
      # site/scripts, whose imports need site/node_modules, and failed on a clean
      # clone that had not installed the site.
      - name: Test the site scripts
        run: bun test scripts --timeout 20000
        working-directory: site

      # Fifty programs through the evaluator, writing GLBs, thumbnails and the
      # index the page reads. Roughly a minute of CPU.
      - name: Build the assets
        run: bun scripts/build-assets.mjs
        working-directory: site

      # Derived from `skills/`, and published with a sha256 per artifact, so it has
      # to be generated in the same run that serves it rather than committed.
      - name: Build the well-known skills index
        run: bun scripts/build-skills-discovery.mjs
        working-directory: site

      - name: Build the site
        run: bun run build
        working-directory: site

      - name: Verify source, downloads and poster records
        run: bun scripts/verify-assets.mjs
        working-directory: site

      - name: Verify static HTML, links and discovery files
        run: node scripts/validate-static.mjs --out .cache/validation
        working-directory: site

      # The browser checks (check-all-pages, verify-site --phase=browser, the island
      # and scene checks) are maintainer gates run against the local build
      # (site/README.md), not steps here. The build above already launches Chrome
      # for the share cards (scripts/build-site-media.mjs finds the runner's
      # preinstalled /usr/bin/google-chrome); no run of this workflow has yet shown
      # that it does, so the browser checks join only after one has.
