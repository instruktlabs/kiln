name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Views must be byte-reproducible in CI: never let a runner that happens to have
  # a GPU render service reachable change what the golden-image tests compare.
  KILN_RENDER: cpu

jobs:
  checks:
    name: typecheck · lint · test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.23.3

      - name: Setup npm
        run: npm install --global npm@12.2.0

      - name: Check toolchain metadata
        run: bun run check:toolchain

      - name: Check skills against the Agent Skills specification
        run: bun run check:skills

      - name: Install
        run: bun install --frozen-lockfile

      - name: Build compiled SDK for public-entrypoint checks
        run: bun run build:sdk

      - name: Typecheck
        run: bun run typecheck

      - name: Lint (Biome)
        run: bun run lint

      # KILN_SPIKE_LIVE=0 (the `test:coverage` script default) keeps tests offline — no model
      # calls, no provider key. `test:live` is the opt-in live path, not run in CI.
      # bunfig.toml reports text + LCOV and enforces the checked-in coverage ratchet.
      - name: Unit tests and coverage gate
        run: bun run test:coverage

      - name: Verify experimental exporter worker and cache isolation
        run: node scripts/exporter-cli-check.mjs

      - name: Engine regressions with the community exporter selected
        env:
          KILN_GLTF_EXPORTER: three
        run: bun run test

      - name: Upload coverage report
        if: ${{ always() && hashFiles('coverage/lcov.info') != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: engine-coverage
          path: coverage/lcov.info
          if-no-files-found: error
          retention-days: 14

  windows-checks:
    name: typecheck · lint · test (Windows)
    runs-on: windows-2022
    # Blocking as of 2026-09-12, on accumulated evidence rather than on one clean run.
    #
    # It landed reporting-only because a retained Windows coverage run had aborted on
    # entry to `examples.test.ts` with a native GLib fault --
    # `g_system_thread_free: The handle is invalid during CloseHandle` -- inside
    # libvips/sharp under Bun's threading, and that fault was INTERMITTENT: two of three
    # reproduction attempts passed. A required check that fails at random is worse than
    # no check at all. The promotion criterion written here was consecutive green
    # builds, which a single run cannot supply.
    #
    # The whole history of this job is nine runs: seven green, two red, and not one
    # recurrence of the fault. Four of the greens are consecutive and two of those are
    # on main. Both reds were new code from the session that added the job -- a
    # `require('sharp/package.json')` that sharp's `exports` map blocks, and a
    # `new URL('..', import.meta.url).pathname` that yields `/D:/a/kiln/src/` and makes
    # every fs call ENOENT. Neither is reachable from a POSIX host. That is the argument
    # for promoting it: the failures were true, and a check that only reports is a check
    # whose findings arrive after the merge.
    #
    # `test` rather than `test:coverage`: the original crash was under coverage, but the
    # ratchet in coverage-thresholds.json is measured on Linux, so a coverage run here
    # would entangle a platform question with a threshold question and fail for the
    # wrong reason.
    #
    # Blocking also means a hang is a blocked merge rather than a slow report, so the
    # job gets a bound. The suite runs in about two minutes here; thirty minutes is room
    # for a cold runner, not for a deadlock.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.23.3

      - name: Check toolchain metadata
        run: bun run check:toolchain

      - name: Install
        run: bun install --frozen-lockfile

      - name: Build compiled SDK for public-entrypoint checks
        run: bun run build:sdk

      - name: Typecheck
        run: bun run typecheck

      - name: Lint (Biome)
        run: bun run lint

      - name: Unit tests
        run: bun run test

      - name: Verify experimental exporter worker and cache isolation
        run: node scripts/exporter-cli-check.mjs

      # Diagnostic only, and deliberately failure-tolerant: it exists so that IF the
      # GLib fault returns, the libvips/GLib versions arrive attached to that run
      # rather than needing a second investigation to reconstruct. It must never be
      # the reason this job reports red. `sharp.versions` rather than the package
      # manifest, because sharp's `exports` map does not expose ./package.json.
      - name: Report the native dependency inventory
        if: ${{ always() }}
        continue-on-error: true
        run: |
          node -p "'node ' + process.version"
          node -e "console.log('sharp versions:', JSON.stringify(require('sharp').versions))"

  render-service-checks:
    name: render service tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # `render-service/` shipped with 37 tests that ran in no workflow. It is a separate
    # npm project with a native dependency, which is presumably why -- but the tests do
    # not need it. All 37 are pure: framing arithmetic, PNG readback packing, cache
    # identity, contract and preset validation. Not one acquires a device.
    #
    # So `--ignore-scripts`, which skips the `webgpu` package's native Dawn build and
    # leaves the package directory in place for the one module that only resolves its
    # path. Verified by running the suite against exactly this install, with no binding
    # built: 37 pass, 0 fail. The GPU smoke and the two conformance runs stay manual,
    # because those genuinely need a device.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.23.3

      - name: Setup npm
        run: npm install --global npm@12.2.0

      - name: Install the render service
        run: npm ci --ignore-scripts
        working-directory: render-service

      - name: Test the render service
        run: npm test
        working-directory: render-service

  package-candidate:
    name: build portable Node package
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.23.3
      - run: npm install --global npm@12.2.0
      - run: bun install --frozen-lockfile
      - run: bun run build:runtime
      - name: Pack without publishing
        run: |
          mkdir candidate
          npm pack --ignore-scripts --pack-destination candidate
      - name: Verify installed SDK and consumer types
        run: |
          set -- candidate/*.tgz
          test "$#" -eq 1
          if ! node scripts/smoke-package.mjs --tarball "$1" --types > candidate/candidate-sdk-receipt.json; then
            cat candidate/candidate-sdk-receipt.json
            exit 1
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: node-package-candidate
          path: |
            candidate/*.tgz
            candidate/candidate-sdk-receipt.json
          if-no-files-found: error
          retention-days: 14

  macos-package:
    name: Node package · macOS ${{ matrix.arch }}
    needs: package-candidate
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # Consumers install only Node/npm. Bun builds the tarball in the separate producer job.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.23.3
          architecture: ${{ matrix.arch }}
      - run: npm install --global npm@12.2.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: node-package-candidate
          path: candidate
      - name: Verify native host
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: node -e "if(process.platform!=='darwin'||process.arch!==process.env.EXPECTED_ARCH)process.exit(1);console.log(process.platform,process.arch,process.version)"
      # Includes opt-in community export through the sanitized worker with native
      # texture encoding, glTF validation and reload; no renderer or GPU required.
      - name: Install and exercise default and community exporter distribution
        shell: bash
        run: |
          set -euo pipefail
          set -- "$PWD"/candidate/*.tgz
          test "$#" -eq 1
          npm run --silent test:package -- --tarball "$1" | tee package-smoke.json
      - name: Verify the retained smoke receipt
        run: node scripts/verify-package-receipt.mjs --platform darwin --arch ${{ matrix.arch }}
      - name: Retain macOS package receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: macos-package-${{ matrix.arch }}
          path: package-smoke.json
          if-no-files-found: warn
          retention-days: 14

  # Linux and Windows package receipts existed in the 2026-09-05 release and were made by
  # hand: `test:package` ran only in the macOS job, so two of the four platforms a release
  # attests to had no reproducible source. These two jobs close that, and deliberately
  # mirror `macos-package` step for step rather than sharing a composite action -- the
  # differences that matter (host assertion, receipt platform, artifact name) are exactly
  # the ones a shared action would hide behind inputs.
  linux-package:
    name: Node package · Linux ${{ matrix.node }}
    needs: package-candidate
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: [20.15.0, 22.2.0, 24.20.0]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # Consumers install only Node/npm. Bun builds the tarball in the separate producer job.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: node-package-candidate
          path: candidate
      - name: Verify native host
        run: node -e "if(process.platform!=='linux')process.exit(1);console.log(process.platform,process.arch,process.version)"
      - name: Install and exercise default and community exporter distribution
        shell: bash
        run: |
          set -euo pipefail
          set -- "$PWD"/candidate/*.tgz
          test "$#" -eq 1
          npm run --silent test:package -- --tarball "$1" | tee package-smoke.json
      - name: Verify the retained smoke receipt
        run: node scripts/verify-package-receipt.mjs --platform linux --arch x64 --node ${{ matrix.node }} --npm "$(npm --version)"
      - name: Retain Linux package receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: linux-package-${{ matrix.node }}
          path: package-smoke.json
          if-no-files-found: warn
          retention-days: 14

  # Preserve main's existing required context while requiring every expanded
  # Linux floor and the new software-renderer probe to succeed. No protection
  # setting needs to be removed or weakened during the cutover.
  linux-package-gate:
    name: Node package · Linux
    needs: [linux-package, software-vulkan-package]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require all Linux qualifications
        env:
          PACKAGES: ${{ needs.linux-package.result }}
          RENDERER: ${{ needs.software-vulkan-package.result }}
        run: test "$PACKAGES" = success && test "$RENDERER" = success

  windows-package:
    name: Node package · Windows
    needs: package-candidate
    timeout-minutes: 30
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.23.3
      - run: npm install --global npm@12.2.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: node-package-candidate
          path: candidate
      - name: Verify native host
        run: node -e "if(process.platform!=='win32')process.exit(1);console.log(process.platform,process.arch,process.version)"
      # bash, not pwsh: the glob expansion and the single-tarball assertion below are the
      # same on every platform, and Windows runners ship Git bash. 13.4's Windows reds
      # were real defects, so this job gets the same 30-minute bound that one does.
      - name: Install and exercise default and community exporter distribution
        shell: bash
        run: |
          set -euo pipefail
          set -- "$PWD"/candidate/*.tgz
          test "$#" -eq 1
          npm run --silent test:package -- --tarball "$1" | tee package-smoke.json
      - name: Verify the retained smoke receipt
        run: node scripts/verify-package-receipt.mjs --platform win32 --arch x64
      - name: Retain Windows package receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-package
          path: package-smoke.json
          if-no-files-found: warn
          retention-days: 14

  software-vulkan-package:
    name: Installed renderer · Linux software Vulkan
    needs: package-candidate
    timeout-minutes: 20
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.23.3
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: node-package-candidate
          path: candidate
      - name: Install Mesa and the exact candidate
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y mesa-vulkan-drivers
          set -- /usr/share/vulkan/icd.d/lvp_icd*.json
          test "$#" -eq 1 && test -f "$1"
          echo "VK_ICD_FILENAMES=$1" >> "$GITHUB_ENV"
          mkdir installation
          cd installation
          npm init -y
          set -- "$GITHUB_WORKSPACE"/candidate/*.tgz
          test "$#" -eq 1
          sha256sum "$1" > ../candidate-sha256.txt
          npm install "$1" --omit=dev --no-audit --no-fund
      # This explicit probe permits software adapters. Production rendering still
      # rejects them; this tests native Vulkan plumbing, not physical GPU support.
      - name: Exercise textured readback on software Vulkan
        run: node scripts/smoke-renderer.mjs ./installation/node_modules/@instruktlabs/kiln renderer-receipt software
      - name: Retain renderer identity and images
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: linux-software-vulkan
          path: |
            renderer-receipt/
            candidate-sha256.txt
          if-no-files-found: warn
          retention-days: 14
