name: Native hosting preflight

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/hosting-probe.yml
      - scripts/hosting/**
      - scripts/smoke-renderer.mjs
      - src/evaluator/**
      - render-service/**
      - package.json
      - bun.lock
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hosting-probe-${{ github.ref }}
  cancel-in-progress: true

# This provider-neutral probe is separate from the package matrix. Both positive
# VM evaluation and restricted-host refusal must pass. Neither qualifies Cloudflare.
jobs:
  nested-evaluator:
    name: Installed nested evaluator · unprivileged Linux VM
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    env:
      KILN_RENDER: cpu
      CANDIDATE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.23.3
      - run: npm install --global npm@12.2.0
      - run: bun install --frozen-lockfile
      - run: bun run build:runtime

      - name: Prepare exact archive and non-setuid Bubblewrap
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .cache/nested-evaluator/context .cache/nested-evaluator/receipts
          context="$PWD/.cache/nested-evaluator/context"
          receipts="$PWD/.cache/nested-evaluator/receipts"
          npm pack --ignore-scripts --pack-destination "$context"
          set -- "$context"/*.tgz
          test "$#" -eq 1 && test -f "$1"
          mv "$1" "$context/candidate.tgz"
          (cd "$context" && sha256sum candidate.tgz > candidate.sha256)
          cp "$context/candidate.sha256" "$receipts/"
          # Build v0.12.0 from its immutable upstream commit. Runner sudo is used
          # only to install build prerequisites/binaries, never to run evaluation.
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends meson ninja-build libcap-dev libcap2-bin pkg-config
          curl --fail --location --proto '=https' --tlsv1.2 \
            https://codeload.github.com/containers/bubblewrap/tar.gz/2a76602a8c71f36c1527cf9fc3417d9149822e0c \
            --output "$context/bubblewrap.tar.gz"
          printf '%s  %s\n' d1383cdc691a335f531564c6d0a1e06165932a4bb9e62a42f952eb0286995431 \
            "$context/bubblewrap.tar.gz" | sha256sum --check
          mkdir "$context/bubblewrap"
          tar -xzf "$context/bubblewrap.tar.gz" --strip-components=1 -C "$context/bubblewrap"
          meson setup "$context/bubblewrap-build" "$context/bubblewrap" \
            -Dman=disabled -Dtests=false -Dbash_completion=disabled -Dzsh_completion=disabled
          meson compile -C "$context/bubblewrap-build"
          test ! -e /usr/local/bin/kiln-probe-bwrap
          test ! -e /usr/local/bin/kiln-probe-node
          sudo install -m 0755 "$context/bubblewrap-build/bwrap" /usr/local/bin/kiln-probe-bwrap
          sudo install -m 0755 "$(command -v node)" /usr/local/bin/kiln-probe-node
          test ! -u /usr/local/bin/kiln-probe-bwrap
          test ! -g /usr/local/bin/kiln-probe-bwrap
          test -z "$(getcap /usr/local/bin/kiln-probe-bwrap /usr/local/bin/kiln-probe-node)"
          /usr/local/bin/kiln-probe-bwrap --version > "$receipts/bwrap-version.txt"
          /usr/local/bin/kiln-probe-node --version > "$receipts/node-version.txt"
          sha256sum /usr/local/bin/kiln-probe-bwrap /usr/local/bin/kiln-probe-node > "$receipts/executables.sha256"
          dpkg-query -W > "$receipts/os-packages.txt"
          uname -a > "$receipts/kernel.txt"
          # Do not change sysctl, AppArmor, seccomp, capabilities or runner policy.
          node --input-type=module -e '
            import {readFileSync, writeFileSync} from "node:fs";
            const policy = {};
            for (const path of ["/proc/sys/user/max_user_namespaces", "/proc/sys/kernel/unprivileged_userns_clone",
                "/proc/sys/kernel/apparmor_restrict_unprivileged_userns"]) {
              try { policy[path] = readFileSync(path, "utf8").slice(0, 4096); } catch { policy[path] = null; }
            }
            writeFileSync(".cache/nested-evaluator/receipts/provenance.json", JSON.stringify({
              commit: process.env.CANDIDATE_COMMIT, runId: process.env.GITHUB_RUN_ID,
              attempt: process.env.GITHUB_RUN_ATTEMPT, provider: "github-actions-ubuntu-22.04-vm",
              uid: process.getuid(), policy, cloudflareQualified: false,
              bubblewrapCommit: "2a76602a8c71f36c1527cf9fc3417d9149822e0c"
            }, null, 2) + "\n");'

      - name: Install archive outside the checkout and require the complete evaluator proof
        id: isolation
        shell: bash
        run: |
          set -euo pipefail
          test "$(id -u)" -ne 0
          test ! -e /app
          sudo mkdir /app
          sudo chown "$(id -u):$(id -g)" /app
          archive="$PWD/.cache/nested-evaluator/context/candidate.tgz"
          receipts="$PWD/.cache/nested-evaluator/receipts"
          (cd /app && npm init -y && npm install "$archive" --omit=dev --include=optional --ignore-scripts --no-audit --no-fund)
          cp /app/package-lock.json "$receipts/package-lock.json"
          # The fixed source fixture runs as the ordinary runner user. The engine
          # itself creates the isolated namespace and strips the child environment.
          set +e
          timeout --signal=TERM --kill-after=15s 180s /usr/local/bin/kiln-probe-node \
            scripts/hosting/run-native-qualification.mjs /app/node_modules/@instruktlabs/kiln \
            "$receipts/isolation" "$archive" --isolation-only > "$receipts/probe.log" 2>&1
          probe_exit=$?
          set -e
          printf '%s\n' "$probe_exit" > "$receipts/probe-exit.txt"
          test "$probe_exit" -eq 0
          node --input-type=module -e '
            import assert from "node:assert/strict";import{readFileSync}from"node:fs";
            const r=JSON.parse(readFileSync(".cache/nested-evaluator/receipts/isolation/receipt.json"));
            assert.equal(r.version,"kiln.nested-evaluator-qualification.v1");
            assert.equal(r.status,"passed");assert.equal(r.checks.length,9);
            assert.equal(r.isolation.checks.length,10);assert.equal(r.artifacts.length,2);
            assert(!r.software);assert(r.uid>0);'

      - name: Diagnose the fixed transport launch without changing restrictions
        if: ${{ !cancelled() && steps.isolation.outcome == 'failure' }}
        shell: bash
        run: |
          set -euo pipefail
          node scripts/hosting/diagnose-native-launch.mjs \
            .cache/nested-evaluator/receipts/transport-diagnostic.json

      - name: Retain VM evaluator evidence, including failed prerequisites
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nested-evaluator-preflight
          path: |
            .cache/nested-evaluator/receipts/
            .cache/nested-evaluator/context/candidate.tgz
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  image-preflight:
    name: Restricted Docker refusal and software rendering
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      KILN_RENDER: cpu
      CANDIDATE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.23.3
      - run: npm install --global npm@12.2.0
      - run: bun install --frozen-lockfile
      - run: bun run build:runtime

      - name: Prepare a six-file context and record candidate identity
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .cache/hosting-ci/context .cache/hosting-ci/receipts
          context="$PWD/.cache/hosting-ci/context"
          receipts="$PWD/.cache/hosting-ci/receipts"
          npm pack --ignore-scripts --pack-destination "$context"
          set -- "$context"/*.tgz
          test "$#" -eq 1 && test -f "$1"
          mv "$1" "$context/candidate.tgz"
          (cd "$context" && sha256sum candidate.tgz > candidate.sha256)
          cp scripts/hosting/Dockerfile scripts/hosting/native-qualification.mjs \
            scripts/hosting/run-native-qualification.mjs scripts/smoke-renderer.mjs "$context/"
          test "$(find "$context" -mindepth 1 -maxdepth 1 -type f | wc -l)" -eq 6
          cp "$context/candidate.sha256" "$receipts/"
          node --input-type=module -e '
            import { writeFileSync } from "node:fs";
            writeFileSync(".cache/hosting-ci/receipts/provenance.json", JSON.stringify({
              commit: process.env.CANDIDATE_COMMIT, runId: process.env.GITHUB_RUN_ID,
              attempt: process.env.GITHUB_RUN_ATTEMPT, provider: "github-actions-docker",
              cloudflareQualified: false
            }, null, 2) + "\n");'

      - name: Build the non-root image without publishing it
        id: image
        shell: bash
        run: |
          set -euo pipefail
          docker build --platform linux/amd64 --tag kiln-native-probe:ci \
            .cache/hosting-ci/context 2>&1 | tee .cache/hosting-ci/receipts/image-build.log
          docker image inspect kiln-native-probe:ci --format \
            '{"id":{{json .Id}},"os":{{json .Os}},"arch":{{json .Architecture}},"user":{{json .Config.User}},"layers":{{json .RootFS.Layers}}}' \
            > .cache/hosting-ci/receipts/image.json
          test "$(docker image inspect kiln-native-probe:ci --format '{{.Config.User}}')" = node
          # A never-started container lets us retain the image inventories even if
          # source isolation fails before the renderer is reached.
          docker create --name kiln-probe-inventory kiln-native-probe:ci
          docker cp kiln-probe-inventory:/app/package-lock.json .cache/hosting-ci/receipts/package-lock.json
          docker cp kiln-probe-inventory:/probe/os-packages.txt .cache/hosting-ci/receipts/os-packages.txt
          docker cp kiln-probe-inventory:/probe/node-version.txt .cache/hosting-ci/receipts/node-version.txt
          docker rm kiln-probe-inventory

      - name: Record bounded namespace diagnostics without changing restrictions
        if: ${{ !cancelled() && steps.image.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          docker create --name kiln-probe-diagnostics --network none --cpus 1 \
            --memory 6g --memory-swap 6g --pids-limit 256 --cap-drop ALL \
            --security-opt no-new-privileges kiln-native-probe:ci \
            node --input-type=module -e '
              import { spawnSync } from "node:child_process";
              import { readFileSync } from "node:fs";
              const commands = [
                ["/usr/bin/bwrap", "--version"],
                ["/usr/bin/unshare", "--user", "--map-root-user", "/usr/bin/true"],
                ["/usr/bin/bwrap", "--unshare-all", "--unshare-user", "--disable-userns", "--die-with-parent",
                  "--ro-bind", "/usr", "/usr", "--symlink", "usr/lib", "/lib",
                  "--symlink", "usr/lib64", "/lib64", "--", "/usr/bin/true"]
              ];
              const checks = commands.map(([command, ...args]) => {
                const r = spawnSync(command, args, {env: {}, encoding: "utf8", timeout: 5000, maxBuffer: 16384});
                return {command, args, status: r.status, signal: r.signal, error: r.error?.code,
                  stdout: r.stdout, stderr: r.stderr};
              });
              const files = {};
              for (const path of ["/proc/sys/user/max_user_namespaces", "/proc/sys/kernel/unprivileged_userns_clone",
                  "/proc/sys/kernel/apparmor_restrict_unprivileged_userns", "/sys/fs/cgroup/cpu.stat"]) {
                try { files[path] = readFileSync(path, "utf8").slice(0, 4096); } catch { files[path] = null; }
              }
              console.log(JSON.stringify({scope: "fixed diagnostics only; not isolation qualification", uid: process.getuid(), checks, files}));'
          timeout --signal=TERM --kill-after=5s 30s docker start --attach kiln-probe-diagnostics \
            > .cache/hosting-ci/receipts/namespace-diagnostics.json

      - name: Require refusal when Docker denies nested isolation
        if: ${{ !cancelled() && steps.image.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          receipts="$PWD/.cache/hosting-ci/receipts"
          docker create --name kiln-probe-isolation --network none --cpus 1 \
            --memory 6g --memory-swap 6g --pids-limit 256 --cap-drop ALL \
            --security-opt no-new-privileges kiln-native-probe:ci \
            node /probe/hosting/run-native-qualification.mjs \
            /app/node_modules/@instruktlabs/kiln /tmp/qualification /probe/candidate.tgz \
            --expect-unsupported-isolation
          set +e
          timeout --signal=TERM --kill-after=15s 240s docker start --attach kiln-probe-isolation \
            > "$receipts/isolation.log" 2>&1
          attached_status=$?
          set -e
          if [ "$(docker inspect kiln-probe-isolation --format '{{.State.Running}}')" = true ]; then
            docker kill kiln-probe-isolation
          fi
          docker inspect kiln-probe-isolation --format '{{json .State}}' > "$receipts/isolation-state.json"
          printf '%s\n' "$attached_status" > "$receipts/isolation-attach-exit.txt"
          # A missing receipt is a failed probe; the log/state above still survives.
          docker cp kiln-probe-isolation:/tmp/qualification "$receipts/isolation"
          test "$attached_status" -eq 0
          test "$(docker inspect kiln-probe-isolation --format '{{.State.ExitCode}}')" -eq 0
          node --input-type=module -e '
            import assert from "node:assert/strict";
            import { readFileSync } from "node:fs";
            const r = JSON.parse(readFileSync(".cache/hosting-ci/receipts/isolation/receipt.json"));
            assert.equal(r.version, "kiln.unsupported-evaluator-rejection.v1");
            assert.equal(r.status, "passed");
            assert.equal(r.isolatedExecutionAvailable, false);
            assert.equal(r.namespaceProbe.permissionDenied, true);
            assert.equal(r.readinessFailure, "wrapper-launch");
            assert.equal(r.evaluationFailure, "WORKER_FAILED");
            assert.deepEqual(r.checks.map(c => c.name), ["host", "kernel-namespace-denied", "readiness-refused", "source-request-refused"]);
            assert.deepEqual(r.artifacts, []);'

      - name: Diagnose the trusted software-renderer fixture independently
        if: ${{ !cancelled() && steps.image.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          receipts="$PWD/.cache/hosting-ci/receipts"
          # Fixed repository fixture only. This run does not qualify untrusted source.
          docker create --name kiln-probe-renderer --network none --cpus 1 \
            --memory 6g --memory-swap 6g --pids-limit 256 --cap-drop ALL \
            --security-opt no-new-privileges kiln-native-probe:ci \
            node /probe/smoke-renderer.mjs /app/node_modules/@instruktlabs/kiln /tmp/renderer software
          set +e
          timeout --signal=TERM --kill-after=15s 180s docker start --attach kiln-probe-renderer \
            > "$receipts/renderer.log" 2>&1
          attached_status=$?
          set -e
          if [ "$(docker inspect kiln-probe-renderer --format '{{.State.Running}}')" = true ]; then
            docker kill kiln-probe-renderer
          fi
          docker inspect kiln-probe-renderer --format '{{json .State}}' > "$receipts/renderer-state.json"
          printf '%s\n' "$attached_status" > "$receipts/renderer-attach-exit.txt"
          docker cp kiln-probe-renderer:/tmp/renderer "$receipts/renderer"
          test "$attached_status" -eq 0
          test "$(docker inspect kiln-probe-renderer --format '{{.State.ExitCode}}')" -eq 0
          node --input-type=module -e 'import{readFileSync}from"node:fs";const r=JSON.parse(readFileSync(".cache/hosting-ci/receipts/renderer/receipt.json"));if(r.status!=="passed"||r.software!==true)process.exit(1)'

      - name: Retain evidence, including unsuccessful qualification
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-hosting-preflight
          path: |
            .cache/hosting-ci/receipts/
            .cache/hosting-ci/context/candidate.tgz
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

      - name: Remove only this job's probe containers
        if: always()
        shell: bash
        run: |
          for name in kiln-probe-inventory kiln-probe-diagnostics kiln-probe-isolation kiln-probe-renderer; do
            if docker container inspect "$name" >/dev/null 2>&1; then
              docker rm --force "$name"
            fi
          done
