name: Hosted gateway checks

on:
  pull_request:
    branches: [main]
    paths:
      - 'hosting/**'
      - 'src/**'
      - 'scripts/build-runtime.mjs'
      - 'scripts/build-sdk.mjs'
      - 'package.json'
      - 'bun.lock'
      - '.github/workflows/hosted-gateway.yml'
  push:
    branches: [main]
    paths:
      - 'hosting/**'
      - 'src/**'
      - 'scripts/build-runtime.mjs'
      - 'scripts/build-sdk.mjs'
      - 'package.json'
      - 'bun.lock'
      - '.github/workflows/hosted-gateway.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hosted-gateway-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gateway:
    name: OAuth, storage and engine adapters · ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    env:
      KILN_RENDER: cpu
    defaults:
      run:
        working-directory: hosting
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.23.3
      - run: npm install --global npm@12.2.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2
      - name: Install the engine's pinned dependencies
        working-directory: .
        run: bun install --frozen-lockfile
      - name: Rebuild the actual Node engine used by the integration tests
        working-directory: .
        run: node scripts/build-runtime.mjs all
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: hosted-gateway-${{ matrix.os }}
          path: .cache/hosted-worker/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
