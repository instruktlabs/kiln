name: Scenes

on:
  pull_request:
    branches: [main]
    paths: ['scenes/**', '.github/workflows/scenes.yml']
  push:
    branches: [main]
    paths: ['scenes/**', '.github/workflows/scenes.yml']

permissions:
  contents: read

jobs:
  portable:
    name: scene source contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.23.3
      - run: bun install --frozen-lockfile
        working-directory: scenes
      - run: bun run check:toolchain && bun run typecheck && bun run lint && bun run test
        working-directory: scenes
