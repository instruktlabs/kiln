version: 2

updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      actions-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: bun
    directories:
      - "/"
      - "/site"
      - "/scenes"
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    ignore:
      # @strands-agents/sdk peers @anthropic-ai/sdk at ^0.109.1 (0.x caret: <0.110).
      # Raise this together with the Strands pin once its peer range moves.
      - dependency-name: "@anthropic-ai/sdk"
        versions: [">=0.110.0"]
    groups:
      bun-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directories:
      - "/render-service"
      - "/scripts/research-discovery"
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      npm-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
