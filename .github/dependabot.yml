version: 2

updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    ignore:
      # plugin-security.yml pins the scanner the awesome-ai-plugins SCANNER_GUIDE names;
      # move it when that guide moves.
      - dependency-name: "hashgraph-online/ai-plugin-scanner-action"
    groups:
      actions-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: bun
    directories:
      - "/"
      - "/site"
      - "/scenes"
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    ignore:
      # @strands-agents/sdk peers @anthropic-ai/sdk at ^0.109.1 (0.x caret: <0.110).
      # Raise this together with the Strands pin once its peer range moves.
      - dependency-name: "@anthropic-ai/sdk"
        versions: [">=0.110.0"]
      # scenes pins npm as a toolchain version (scenes/toolchain.json); it moves with the
      # maintainer toolchain, never on its own.
      - dependency-name: "npm"
      # three moves by hand, in one change across the engine, render service, site and
      # scenes (docs/three-upgrades.md). A release changes GPU views, and the change
      # must move the render service's build identity, the scene kit's revision guards
      # and the scene pin table with it; a Dependabot update edits manifests and
      # lockfiles only.
      - dependency-name: "three"
      - dependency-name: "@types/three"
    groups:
      bun-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directories:
      - "/render-service"
      - "/scripts/research-discovery"
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    ignore:
      # three moves by hand with the other trees (docs/three-upgrades.md); see the bun entry.
      - dependency-name: "three"
    groups:
      npm-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
